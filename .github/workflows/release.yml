name: Build & Release OrderVPN Web

on:
  push:
    branches: [main, master]
    paths:
      - 'ordervpn-src/**'
      - 'build.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override web-panel version'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-3.12.4}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: v$VERSION"

      - name: Build tarball
        run: |
          chmod +x build.sh
          bash build.sh "${{ steps.version.outputs.version }}"
          ls -lh ordervpn-src.tar.gz

      - name: Get SHA256
        id: sha
        run: |
          set -euo pipefail
          SHA=$(sha256sum ordervpn-src.tar.gz | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag/versi disatukan dengan release VPN binary (vX.Y.Z) agar
          # /releases/latest/download/vpn selalu mengarah ke release yang punya
          # asset vpn + vpn.sha256. Jangan buat tag terpisah (mis. web-vX).
          tag_name: v${{ steps.version.outputs.version }}
          name: OrderVPN v${{ steps.version.outputs.version }}
          body: |
            ## OrderVPN Web v${{ steps.version.outputs.version }}

            Auto-built from `ordervpn-src/` on push to main.

            ### 🔗 Commit
            [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### 📦 Asset
            - `ordervpn-src.tar.gz` — extract to `/var/www/html/ordervpn`

            ### 🔑 SHA256
            ```
            ${{ steps.sha.outputs.sha256 }}
            ```

            ### 🚀 Deploy
            ```bash
            wget ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/ordervpn-src.tar.gz
            tar -xzf ordervpn-src.tar.gz -C /var/www/html/ordervpn --strip-components=1
            ```
          files: ordervpn-src.tar.gz
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
